[project]
name = "jianlai"
version = "0.1.0"
description = "剑来 (Jianlai) — AI 驱动的自主漏洞挖掘 Agent | 我有一剑，可破万法"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "rich>=13.9.0",
    "click>=8.1.0",
    "beautifulsoup4>=4.12.0",
    "tldextract>=5.1.0",
    "dnspython>=2.7.0",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
jianlai = "jianlai.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jianlai*"]
